<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation III: Pre-Paid Lease Calculator</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #2563eb;
            --accent: #f59e0b;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge {
            background: var(--accent);
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .content {
            padding: 24px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e2e8f0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fff;
            color: #1e293b;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .results-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 0.95rem;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row.highlight {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--secondary);
            border-top: 2px solid var(--border-color);
            border-bottom: none;
            margin-top: 8px;
            padding-top: 14px;
        }

        .btn-calculate {
            background: var(--secondary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-calculate:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Operation III: Pre-Paid Lease Calculator</h1>
        <span class="badge">SECURE MODE</span>
    </div>

    <div class="content">
        <div class="section-title">Pre-Paid Lease Parameters</div>
        <div class="grid-2">
            <div class="form-group">
                <label for="p-msrp">MSRP ($)</label>
                <input type="number" id="p-msrp" value="50000" oninput="calculatePrepaid()">
            </div>
            <div class="form-group">
                <label for="p-selling">Negotiated Selling Price ($)</label>
                <input type="number" id="p-selling" value="48000" oninput="calculatePrepaid()">
            </div>
            <div class="form-group">
                <label for="p-residual">Residual Value (%)</label>
                <input type="number" id="p-residual" value="55" oninput="calculatePrepaid()">
            </div>
            <div class="form-group">
                <label for="p-term">Term (Months)</label>
                <input type="number" id="p-term" value="36" oninput="calculatePrepaid()">
            </div>
            <div class="form-group">
                <label for="p-rate">Interest Rate / Money Factor (%)</label>
                <input type="number" id="p-rate" value="5.99" step="0.01" oninput="calculatePrepaid()">
            </div>
            <div class="form-group">
                <label for="p-tax">Tax Rate (%)</label>
                <input type="number" id="p-tax" value="13" step="0.1" oninput="calculatePrepaid()">
            </div>
        </div>

        <div class="results-card">
            <div class="section-title" style="margin-bottom: 10px; border: none;">Pre-Paid Breakdown Summary</div>
            <div class="result-row">
                <span>Calculated Residual Value:</span>
                <span id="res-p-residual">$27,500.00</span>
            </div>
            <div class="result-row">
                <span>Total Monthly Depreciation:</span>
                <span id="res-p-depr">$569.44</span>
            </div>
            <div class="result-row">
                <span>Total Rent Charge:</span>
                <span id="res-p-rent">$3,845.20</span>
            </div>
            <div class="result-row highlight">
                <span>Total Pre-Paid Lease Amount (Incl. Tax):</span>
                <span id="res-p-total">$35,417.89</span>
            </div>
        </div>
        <button class="btn-calculate" onclick="calculatePrepaid()">Recalculate Pre-Paid Lease</button>
    </div>
</div>

<script>
    function calculatePrepaid() {
        const msrp = parseFloat(document.getElementById('p-msrp').value) || 0;
        const selling = parseFloat(document.getElementById('p-selling').value) || 0;
        const residualPct = parseFloat(document.getElementById('p-residual').value) || 0;
        const term = parseInt(document.getElementById('p-term').value) || 36;
        const rate = parseFloat(document.getElementById('p-rate').value) || 0;
        const taxRate = parseFloat(document.getElementById('p-tax').value) || 0;

        const residualVal = msrp * (residualPct / 100);
        const totalDepr = selling - residualVal;
        const monthlyDepr = totalDepr / term;
        
        const monthlyRate = (rate / 100) / 12;
        let totalRent = 0;
        
        if (monthlyRate > 0) {
            totalRent = (selling + residualVal) * (monthlyRate / 2) * term * 0.82; 
        } else {
            totalRent = 0;
        }

        const subtotal = totalDepr + totalRent;
        const taxAmount = subtotal * (taxRate / 100);
        const grandTotal = subtotal + taxAmount;

        document.getElementById('res-p-residual').innerText = '$' + residualVal.toFixed(2);
        document.getElementById('res-p-depr').innerText = '$' + monthlyDepr.toFixed(2);
        document.getElementById('res-p-rent').innerText = '$' + totalRent.toFixed(2);
        document.getElementById('res-p-total').innerText = '$' + grandTotal.toFixed(2);
    }

    window.onload = function() {
        calculatePrepaid();
    };
</script>

</body>
</html>
