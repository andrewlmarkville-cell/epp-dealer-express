<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPP Dealer Express | Matrix Module</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 14px; }
        .logo { font-size: 16px; font-weight: 900; color: #0f172a; background: #f59e0b; padding: 3px 7px; border-radius: 5px; }
        .title { font-size: 15px; font-weight: bold; color: #ffffff; }
        .author { font-size: 11px; color: #f59e0b; font-weight: 700; }
        .container { display: flex; flex-direction: column; gap: 12px; }
        .sum-card { background: rgba(245, 158, 11, 0.08); border: 1.5px solid #f59e0b; padding: 16px; border-radius: 12px; text-align: center; }
        .sum-card .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .sum-card .val { font-size: 28px; font-weight: 900; color: #f59e0b; margin-top: 4px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; }
        .card-title { font-size: 12px; font-weight: 700; color: #f59e0b; margin-bottom: 10px; text-transform: uppercase; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 3px; }
        .field input, .field select { width: 100%; background-color: #0f172a; border: 1px solid #475569; color: #ffffff; padding: 8px 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .grid-2 { display: flex; gap: 10px; }
        .grid-2 > div { flex: 1; }
        .res-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 12px; }
        .res-row:last-child { border-bottom: none; }
        .res-label { color: #94a3b8; }
        .res-val { font-weight: bold; color: #f8fafc; }
        .text-gold { color: #f59e0b; }
        .text-sky { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="logo">EPP</span>
            <span class="title">Dealer Express | Matrix Module</span>
        </div>
        <span class="author">Andrew Lam</span>
    </div>

    <div class="container">
        <!-- Summary -->
        <div class="sum-card">
            <div class="label">One-Pay Total Due on Delivery</div>
            <div class="val" id="outTotal">$0</div>
        </div>

        <!-- Vehicle Bulletin Matrix -->
        <div class="card">
            <div class="card-title">1. Automated Vehicle Bulletin Matrix</div>
            <div class="field">
                <label>Select Vehicle Model & Bulletin Matrix</label>
                <select id="selVehicle" onchange="onVehicleChange()">
                    <optgroup label="Toyota / TFS">
                        <option value="toyota_rav4">2026 Toyota RAV4 LE AWD (MSRP: $38,000)</option>
                        <option value="toyota_camry">2026 Toyota Camry SE AWD (MSRP: $36,500)</option>
                        <option value="toyota_highlander">2026 Toyota Grand Highlander XLE (MSRP: $54,000)</option>
                    </optgroup>
                    <optgroup label="Lexus / LFS">
                        <option value="lexus_nx">2026 Lexus NX 350 Luxury (MSRP: $58,000)</option>
                        <option value="lexus_rx">2026 Lexus RX 350 Executive (MSRP: $74,000)</option>
                    </optgroup>
                    <optgroup label="Subaru / SFS">
                        <option value="subaru_outback">2026 Subaru Outback Touring (MSRP: $41,500)</option>
                        <option value="subaru_crosstrek">2026 Subaru Crosstrek Convenience (MSRP: $33,000)</option>
                    </optgroup>
                </select>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Lease Term</label>
                    <select id="selTerm" onchange="onVehicleChange()">
                        <option value="24">24 Months</option>
                        <option value="36" selected>36 Months</option>
                        <option value="48">48 Months</option>
                        <option value="60">60 Months</option>
                    </select>
                </div>
                <div class="field">
                    <label>Base Price / MSRP ($)</label>
                    <input type="number" id="inpPrice" value="38000" oninput="runCalc()">
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Freight & Fees ($)</label>
                    <input type="number" id="inpFreight" value="2300" oninput="runCalc()">
                </div>
                <div class="field">
                    <label>Residual Value (%)</label>
                    <input type="number" id="inpResidual" value="58" oninput="runCalc()">
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Lease Rate (%)</label>
                    <input type="number" id="inpRate" value="6.9" step="0.01" oninput="runCalc()">
                </div>
                <div class="field">
                    <label>Sales Tax Rate (%)</label>
                    <input type="number" id="inpTax" value="13" step="0.1" oninput="runCalc()">
                </div>
            </div>
        </div>

        <!-- Deal Structure & Rate Mode -->
        <div class="card">
            <div class="card-title">2. Deal Structure & Rate Mode</div>
            <div class="field">
                <label>Deal Type</label>
                <select id="selDealType" onchange="onDealTypeChange()">
                    <option value="standard" selected>Standard Retail (Standard Bulletin Rate)</option>
                    <option value="subvented">Subvented Promo Deal (OEM Promo Rate)</option>
                </select>
            </div>
            <div class="field" id="fieldStdRate">
                <label>Standard Bulletin Rate (%)</label>
                <input type="number" id="inpStdRateDisplay" value="6.9" step="0.01" readonly>
            </div>
            <div class="field" id="fieldSubRate" style="display: none;">
                <label>Subvented Promo Rate (%)</label>
                <input type="number" id="inpSubRateDisplay" value="2.49" step="0.01" readonly>
            </div>
        </div>

        <!-- Breakdown -->
        <div class="card">
            <div class="card-title">Financial Breakdown</div>
            <div class="res-row"><span class="res-label">Net Cap Cost:</span><span class="res-val text-sky" id="resNetCap">$0</span></div>
            <div class="res-row"><span class="res-label">Residual Value (LEV):</span><span class="res-val" id="resResidual">$0</span></div>
            <div class="res-row"><span class="res-label">Effective Rate:</span><span class="res-val text-gold" id="resRate">0%</span></div>
        </div>
    </div>

    <script>
        var vehicleDatabase = {
            "toyota_rav4": { msrp: 38000, data: { "24": { std: 6.9, sub: 1.99, res: 64 }, "36": { std: 6.9, sub: 2.49, res: 58 }, "48": { std: 7.4, sub: 3.49, res: 50 }, "60": { std: 7.4, sub: 3.99, res: 42 } } },
            "toyota_camry": { msrp: 36500, data: { "24": { std: 5.9, sub: 0.99, res: 62 }, "36": { std: 5.9, sub: 1.49, res: 56 }, "48": { std: 6.4, sub: 2.49, res: 48 }, "60": { std: 6.4, sub: 2.99, res: 40 } } },
            "toyota_highlander": { msrp: 54000, data: { "24": { std: 7.2, sub: 2.99, res: 60 }, "36": { std: 7.2, sub: 3.49, res: 54 }, "48": { std: 7.7, sub: 4.29, res: 46 }, "60": { std: 7.7, sub: 4.79, res: 38 } } },
            "lexus_nx": { msrp: 58000, data: { "24": { std: 6.2, sub: 2.99, res: 65 }, "36": { std: 6.2, sub: 3.49, res: 59 }, "48": { std: 6.7, sub: 3.99, res: 51 }, "60": { std: 6.7, sub: 4.49, res: 43 } } },
            "lexus_rx": { msrp: 74000, data: { "24": { std: 6.4, sub: 3.29, res: 63 }, "36": { std: 6.4, sub: 3.79, res: 57 }, "48": { std: 6.9, sub: 4.29, res: 49 }, "60": { std: 6.9, sub: 4.79, res: 41 } } },
            "subaru_outback": { msrp: 41500, data: { "24": { std: 6.49, sub: 1.99, res: 60 }, "36": { std: 6.49, sub: 2.29, res: 54 }, "48": { std: 6.99, sub: 2.99, res: 46 }, "60": { std: 6.99, sub: 3.49, res: 38 } } },
            "subaru_crosstrek": { msrp: 33000, data: { "24": { std: 6.29, sub: 1.49, res: 62 }, "36": { std: 6.29, sub: 1.99, res: 56 }, "48": { std: 6.79, sub: 2.69, res: 48 }, "60": { std: 6.79, sub: 3.19, res: 40 } } }
        };

        function onVehicleChange() {
            var key = document.getElementById('selVehicle').value;
            var term = document.getElementById('selTerm').value;
            var prof = vehicleDatabase[key];
            if (prof && prof.data[term]) {
                document.getElementById('inpPrice').value = prof.msrp;
                document.getElementById('inpResidual').value = prof.data[term].res;
                window.storedStd = prof.data[term].std;
                window.storedSub = prof.data[term].sub;
            }
            applyRates();
        }

        function onDealTypeChange() {
            var dtype = document.getElementById('selDealType').value;
            document.getElementById('fieldStdRate').style.display = (dtype === 'standard') ? 'block' : 'none';
            document.getElementById('fieldSubRate').style.display = (dtype === 'subvented') ? 'block' : 'none';
            applyRates();
        }

        function applyRates() {
            var dtype = document.getElementById('selDealType').value;
            var activeRate = (dtype === 'subvented') ? (window.storedSub || 2.49) : (window.storedStd || 6.9);
            
            document.getElementById('inpRate').value = activeRate;
            document.getElementById('inpStdRateDisplay').value = window.storedStd || 6.9;
            document.getElementById('inpSubRateDisplay').value = window.storedSub || 2.49;
            runCalc();
        }

        function runCalc() {
            var price = parseFloat(document.getElementById('inpPrice').value) || 0;
            var freight = parseFloat(document.getElementById('inpFreight').value) || 0;
            var term = parseInt(document.getElementById('selTerm').value) || 36;
            var resPct = (parseFloat(document.getElementById('inpResidual').value) || 0) / 100;
            var rate = parseFloat(document.getElementById('inpRate').value) || 0;
            var tax = (parseFloat(document.getElementById('inpTax').value) || 0) / 100;

            var residualVal = price * resPct;
            var grossCap = price + freight;
            var depreciation = Math.max(0, grossCap - residualVal);
            
            var mf = rate / 2400;
            var finCharge = (grossCap + residualVal) * mf * term;
            var totalDue = (depreciation + finCharge) * (1 + tax);

            document.getElementById('outTotal').textContent = '$' + Math.round(totalDue).toLocaleString();
            document.getElementById('resNetCap').textContent = '$' + Math.round(grossCap).toLocaleString();
            document.getElementById('resResidual').textContent = '$' + Math.round(residualVal).toLocaleString();
            document.getElementById('resRate').textContent = rate.toFixed(2) + '%';
        }

        // Initialize
        onVehicleChange();
    </script>
</body>
</html>
