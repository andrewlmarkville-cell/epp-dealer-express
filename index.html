<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPP Executive Presentation | One-Pay Lease Benefits</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 14px; }
        .logo { font-size: 16px; font-weight: 900; color: #0f172a; background: #f59e0b; padding: 3px 7px; border-radius: 5px; }
        .title { font-size: 15px; font-weight: bold; color: #ffffff; }
        .author { font-size: 11px; color: #f59e0b; font-weight: 700; }
        .container { display: flex; flex-direction: column; gap: 12px; }
        .sum-card { background: rgba(74, 222, 128, 0.08); border: 1.5px solid #4ade80; padding: 16px; border-radius: 12px; text-align: center; }
        .sum-card .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .sum-card .val { font-size: 30px; font-weight: 900; color: #4ade80; margin-top: 4px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; }
        .card-title { font-size: 12px; font-weight: 700; color: #f59e0b; margin-bottom: 10px; text-transform: uppercase; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 3px; }
        .field input, .field select { width: 100%; background-color: #0f172a; border: 1px solid #475569; color: #ffffff; padding: 8px 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .field input:focus, .field select:focus { border-color: #f59e0b; }
        .grid-2 { display: flex; gap: 10px; }
        .grid-2 > div { flex: 1; }
        .res-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 12px; }
        .res-row:last-child { border-bottom: none; }
        .res-label { color: #94a3b8; }
        .res-val { font-weight: bold; color: #f8fafc; }
        .text-gold { color: #f59e0b; }
        .text-sky { color: #38bdf8; }
        .text-green { color: #4ade80; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="logo">EPP</span>
            <span class="title">Executive Demo | Pre-Paid Value Analysis</span>
        </div>
        <span class="author">Andrew Lam</span>
    </div>

    <div class="container">
        <!-- Summary Benefit Card -->
        <div class="sum-card">
            <div class="label">Total Customer Interest Savings</div>
            <div class="val" id="outSavings">$0</div>
        </div>

        <!-- Demonstration Parameters -->
        <div class="card">
            <div class="card-title">Demonstration Deal Parameters</div>

            <div class="grid-2">
                <div class="field">
                    <label>Lease Term (Months)</label>
                    <select id="inpTerm" onchange="runDemoCalc()">
                        <option value="24">24 Months</option>
                        <option value="36" selected>36 Months</option>
                        <option value="48">48 Months</option>
                    </select>
                </div>
                <div class="field">
                    <label>Vehicle MSRP / Price ($)</label>
                    <input type="number" id="inpPrice" value="38000" oninput="runDemoCalc()">
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Freight & Fees ($)</label>
                    <input type="number" id="inpFreight" value="2300" oninput="runDemoCalc()">
                </div>
                <div class="field">
                    <label>Residual Value (%)</label>
                    <input type="number" id="inpResidual" value="58" oninput="runDemoCalc()">
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Standard Subvented Rate (%)</label>
                    <input type="number" id="inpStdRate" value="3.99" step="0.01" oninput="runDemoCalc()">
                </div>
                <div class="field">
                    <label>Estimated Pre-Paid Rate (%)</label>
                    <input type="number" id="inpPreRate" value="2.49" step="0.01" oninput="runDemoCalc()">
                </div>
            </div>

            <div class="field">
                <label>Sales Tax Rate (%)</label>
                <input type="number" id="inpTax" value="13" step="0.1" oninput="runDemoCalc()">
            </div>
        </div>

        <!-- Comparative Breakdown -->
        <div class="card">
            <div class="card-title">Proposal Comparison</div>
            <div class="res-row"><span class="res-label">Net Capitalized Cost:</span><span class="res-val text-sky" id="resNetCap">$0</span></div>
            <div class="res-row"><span class="res-label">Standard Monthly Total Cost:</span><span class="res-val" id="resStdTotal">$0</span></div>
            <div class="res-row"><span class="res-label">Pre-Paid One-Pay Total Due:</span><span class="res-val text-gold" id="resPreTotal">$0</span></div>
            <div class="res-row"><span class="res-label">Effective Monthly Payment Drop:</span><span class="res-val text-green" id="resMonthlyDiff">$0 /mo</span></div>
        </div>
    </div>

    <script>
        function runDemoCalc() {
            var price = parseFloat(document.getElementById('inpPrice').value) || 0;
            var freight = parseFloat(document.getElementById('inpFreight').value) || 0;
            var term = parseInt(document.getElementById('inpTerm').value) || 36;
            var resPct = (parseFloat(document.getElementById('inpResidual').value) || 0) / 100;
            var stdRate = parseFloat(document.getElementById('inpStdRate').value) || 0;
            var preRate = parseFloat(document.getElementById('inpPreRate').value) || 0;
            var tax = (parseFloat(document.getElementById('inpTax').value) || 0) / 100;

            var netCap = price + freight;
            var residualVal = price * resPct;
            var depreciation = Math.max(0, netCap - residualVal);
            
            // Standard Calculation
            var stdMF = stdRate / 2400;
            var stdFinCharge = (netCap + residualVal) * stdMF * term;
            var stdTotalDue = (depreciation + stdFinCharge) * (1 + tax);

            // Pre-Paid Calculation
            var preMF = preRate / 2400;
            var preFinCharge = (netCap + residualVal) * preMF * term;
            var preTotalDue = (depreciation + preFinCharge) * (1 + tax);

            var savings = Math.max(0, stdTotalDue - preTotalDue);
            var monthlyDiff = savings / term;

            document.getElementById('outSavings').textContent = '$' + Math.round(savings).toLocaleString();
            document.getElementById('resNetCap').textContent = '$' + Math.round(netCap).toLocaleString();
            document.getElementById('resStdTotal').textContent = '$' + Math.round(stdTotalDue).toLocaleString();
            document.getElementById('resPreTotal').textContent = '$' + Math.round(preTotalDue).toLocaleString();
            document.getElementById('resMonthlyDiff').textContent = '$' + Math.round(monthlyDiff).toLocaleString() + ' /mo';
        }

        runDemoCalc();
    </script>
</body>
</html>
